<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Crazy Eights - Midgame</title>
    <link rel="stylesheet" type="text/css" href="hw5_static_state.css">
</head>
<body>
    <div class="game">
        <!-- opponent hand -->
        <div class="hand opponent-hand">
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
        </div>

        <!-- discard & deck piles -->
        <div class="piles">
            <div class="deck">DRAW</div>
            <div class="discard">8♣</div>
        </div>

        <!-- player hand -->
        <div class="hand player-hand">
            <div class="card">8♣</div>
            <div class="card">Q♠</div>
            <div class="card">5♥</div>
        </div>

        <!-- turn indicator -->
        <div class="turn-indicator">Opponent's turn…</div>
    </div>
</body>
</html>
