<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Crazy Eights - Endgame</title>
    <link rel="stylesheet" type="text/css" href="hw5_static_state.css">
</head>
<body>
    <div class="game">
        <!-- opponent hand -->
        <div class="hand opponent-hand">
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
        </div>

        <!-- discard & deck piles -->
        <div class="piles">
            <div class="deck"></div>
            <div class="discard">7♦</div>
        </div>

        <!-- player hand -->
        <div class="hand player-hand">
            <div class="card">J♦</div>
        </div>

        <!-- turn indicator -->
        <div class="turn-indicator">You win!</div>
    </div>
</body>
</html>
