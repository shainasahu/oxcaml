<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Crazy Eights - Start</title>
    <link rel="stylesheet" type="text/css" href="hw5_static_state.css">
</head>
<body>
    <div class="game">
        <!-- opponent hand (face-down) -->
        <div class="hand opponent-hand">
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
            <div class="card face-down"></div>
        </div>

        <!-- discard & deck piles -->
        <div class="piles">
            <div class="deck">DRAW</div>
            <div class="discard">7♦</div>
        </div>

        <!-- player hand -->
        <div class="hand player-hand">
            <div class="card">5♥</div>
            <div class="card">9♠</div>
            <div class="card">8♦</div>
            <div class="card">K♣</div>
            <div class="card">2♣</div>
        </div>

        <!-- turn indicator -->
        <div class="turn-indicator">Your turn!</div>
    </div>
</body>
</html>
